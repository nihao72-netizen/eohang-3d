<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>어항 알갱이 보기</title>
<style>
  :root{
    --bg:#0b0f14; --panel:rgba(11,15,20,.9); --line:#1e293b; --text:#e2e8f0; --dim:#64748b;
    --accent:#7dd3fc; --ok:#86efac; --okmark:#22c55e; --bad:#fca5a5; --badmark:#ef4444; --run:#eab308;
    --btn:#1e293b; --btnhover:#334155; --btnline:#334155;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #c{display:block;width:100%;height:100%;touch-action:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:12.5px;line-height:1.65;backdrop-filter:blur(6px)}
  #hud{left:16px;top:16px;max-width:min(340px,calc(100vw - 32px))}
  #hud h1{margin:0 0 6px;font-size:14px;color:var(--accent);font-weight:600}
  #steps{margin:0;padding:0;list-style:none}
  #steps li{padding:1px 0;color:var(--dim)}
  #steps li::before{content:"    ";white-space:pre;font-family:ui-monospace,Consolas,monospace}
  #steps li.run::before{content:".. ";color:var(--run)}
  #steps li.ok{color:var(--ok)}
  #steps li.ok::before{content:"OK ";color:var(--okmark);font-weight:700}
  #steps li.bad{color:var(--bad)}
  #steps li.bad::before{content:"X  ";color:var(--badmark);font-weight:700}
  #stats{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:0 10px}
  #stats dt{color:var(--dim)} #stats dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  #err{margin-top:10px;padding:10px;border-radius:8px;background:#2a1215;border:1px solid #7f1d1d;
    color:#fecaca;display:none;white-space:pre-wrap}
  #err.show{display:block}
  #ctl{right:16px;top:16px;text-align:right}
  button{background:var(--btn);color:var(--text);border:1px solid var(--btnline);border-radius:8px;
    padding:6px 11px;font-size:12px;cursor:pointer;margin:2px;font-family:inherit}
  button:hover{background:var(--btnhover)}
  button.on{background:#0369a1;border-color:#0ea5e9}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .hint{color:var(--dim);font-size:11.5px;margin-top:4px}
  #cmp{right:16px;bottom:16px;max-width:min(560px,calc(100vw - 32px));max-height:40vh;overflow:auto}
  #cmp h2{margin:0 0 4px;font-size:13px;color:var(--accent);font-weight:600}
  #cmp table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  #cmp th,#cmp td{padding:2px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  #cmp th:first-child,#cmp td:first-child{text-align:left;white-space:normal;overflow-wrap:anywhere}
  #cmp th{color:var(--dim);font-weight:500}
  #cmp tr.cur td{color:var(--ok)}
  #cmp tr.bad td{color:var(--bad)}
  #cmp .empty{color:var(--dim)}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;
    background:rgba(3,105,161,.18);border:3px dashed #0ea5e9;font-size:18px;color:var(--text)}
  #drop.show{display:flex}
  @media (max-width:600px){
    #hud{top:auto;bottom:16px}
    #ctl{left:16px;right:16px;text-align:left}
    #cmp{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="hud">
  <h1>어항 알갱이 보기</h1>
  <ul id="steps">
    <li id="s-lib">라이브러리 불러오기</li>
    <li id="s-renderer">렌더러 넣기</li>
    <li id="s-fetch">파일 받기</li>
    <li id="s-decode">알갱이로 풀기</li>
    <li id="s-measure">크기 재기</li>
  </ul>
  <dl id="stats">
    <dt>파일</dt><dd id="v-file">-</dd>
    <dt>파일 크기</dt><dd id="v-size">-</dd>
    <dt>받은 시간</dt><dd id="v-time">-</dd>
    <dt>알갱이</dt><dd id="v-count">-</dd>
    <dt>푸는 시간</dt><dd id="v-decode">-</dd>
  </dl>
  <div id="err"></div>
</div>

<div class="panel" id="ctl">
  <button id="b-fit">화면에 맞추기</button><button id="b-flip">위아래 뒤집기</button><button id="b-open">파일 열기</button>
  <input type="file" id="picker" accept=".sog,.ply,.spz,.splat,.ksplat" hidden>
  <div class="hint">끌기: 돌리기 · 휠: 확대 · 오른쪽 끌기: 옮기기</div>
  <div class="hint">.ply · .compressed.ply · .sog · .spz 파일을 끌어다 놓으면 바꿔 봅니다</div>
</div>

<div class="panel" id="cmp">
  <h2>형식 비교</h2>
  <table>
    <thead><tr><th>파일</th><th>크기 (바이트)</th><th>알갱이</th><th>푸는 시간</th></tr></thead>
    <tbody id="cmp-body"><tr><td class="empty" colspan="4">아직 연 파일이 없습니다</td></tr></tbody>
  </table>
</div>

<div id="drop">여기에 놓으면 이 파일로 바꿔 봅니다</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
}}
</script>
<script type="module">
/* ============ 여기서 파일 이름을 바꾼다 ============ */
const SPLAT_FILE = "scene.sog";   // 같은 폴더의 .sog / .ply / .compressed.ply / .spz / .splat
/* ================================================== */

// 확장자 → Spark 2.4.0 형식 이름. 확장자와 다르므로 그대로 넘기면 안 된다.
// .compressed.ply 는 PLY 안에 압축 칸을 둔 것이라 Spark 에서는 "ply" 로 읽는다.
const FILE_TYPE = {
  "compressed.ply": "ply",
  ply: "ply",
  sog: "pcsogszip",
  spz: "spz",
  splat: "splat",
  ksplat: "ksplat",
};
function fileTypeOf(name) {
  const lower = name.toLowerCase();
  const key = Object.keys(FILE_TYPE).find(ext => lower.endsWith("." + ext));
  return key ? { ext: key, type: FILE_TYPE[key] } : null;
}

const $ = id => document.getElementById(id);
const step = (id, state, text) => { const li = $(id); li.className = state; if (text) li.textContent = text; };
const fmtInt = n => n.toLocaleString("ko-KR");
const fmtSize = b => `${fmtInt(b)}바이트 (${(b / 1e6).toFixed(1)}MB)`;
function showError(msg) { const e = $("err"); e.classList.add("show"); e.textContent = msg; }
function clearError() { const e = $("err"); e.classList.remove("show"); e.textContent = ""; }
function fail(id, msg) { if (id) step(id, "bad"); showError(msg); }
addEventListener("unhandledrejection", e => fail(null, "처리 못 한 오류: " + (e.reason?.message ?? e.reason)));

// 1. 라이브러리 불러오기
step("s-lib", "run");
let THREE, OrbitControls, SPARK;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  SPARK = await import("@sparkjsdev/spark");
  step("s-lib", "ok", `라이브러리 불러오기 (three r${THREE.REVISION}, Spark 2.4.0)`);
} catch (e) {
  fail("s-lib", "three.js 나 Spark 를 못 불러왔습니다. 인터넷 연결을 확인하세요.\n" + e.message);
  throw e;
}

const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f14);
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 1000);
camera.position.set(2, 1, 2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

// 2. 렌더러 넣기: SparkRenderer 를 장면에 넣지 않으면 오류 없이 화면이 까맣다
step("s-renderer", "run");
const spark = new SPARK.SparkRenderer({ renderer });
scene.add(spark);
step("s-renderer", "ok");

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

let mesh = null, localBox = null, flipped = false, loadToken = 0;
const results = [];   // 비교표에 쌓는 기록

function renderTable() {
  const body = $("cmp-body");
  body.replaceChildren();
  if (!results.length) {
    const tr = body.insertRow(); const td = tr.insertCell();
    td.colSpan = 4; td.className = "empty"; td.textContent = "아직 연 파일이 없습니다";
    return;
  }
  results.forEach((r, i) => {
    const tr = body.insertRow();
    if (r.error) tr.className = "bad"; else if (i === results.length - 1) tr.className = "cur";
    const cells = r.error
      ? [r.name, fmtInt(r.size), "실패", r.error]
      : [r.name, fmtInt(r.size), fmtInt(r.count), `${r.decodeSec.toFixed(2)}초`];
    for (const v of cells) tr.insertCell().textContent = v;
  });
}

// 4. 알갱이로 풀기 (처음 파일과 끌어다 놓은 파일이 같은 길로 간다)
async function showSplats(bytes, name, { fitCamera }) {
  const token = ++loadToken;
  clearError();
  $("v-file").textContent = name;
  $("v-size").textContent = fmtSize(bytes.byteLength);
  $("v-count").textContent = "-"; $("v-decode").textContent = "-";
  step("s-decode", "run", "알갱이로 풀기");
  const ft = fileTypeOf(name);
  let next;
  try {
    if (!ft) throw new Error(`모르는 확장자입니다: ${name}`);
    const t0 = performance.now();
    next = new SPARK.SplatMesh({ fileBytes: bytes, fileType: ft.type, fileName: name });
    await next.initialized;
    const decodeSec = (performance.now() - t0) / 1000;
    if (token !== loadToken) { next.dispose?.(); return; }   // 그사이 다른 파일을 놓았다
    const count = next.numSplats ?? next.splats?.getNumSplats?.() ?? 0;
    if (!count) throw new Error("알갱이가 0개입니다");

    if (mesh) { scene.remove(mesh); mesh.dispose?.(); }
    mesh = next;
    mesh.rotation.x = flipped ? Math.PI : 0;
    scene.add(mesh);

    $("v-count").textContent = `${fmtInt(count)}개`;
    $("v-decode").textContent = `${decodeSec.toFixed(2)}초`;
    step("s-decode", "ok", `알갱이로 풀기 (${ft.type})`);
    results.push({ name, size: bytes.byteLength, count, decodeSec, type: ft.type });
    renderTable();

    // 5. 크기 재기: Box3.setFromObject 는 SplatMesh 에 빈 상자를 준다. Spark 의 getBoundingBox 를 쓴다
    step("s-measure", "run");
    localBox = mesh.getBoundingBox(true);
    if (localBox.isEmpty()) { localBox = null; throw new Error("크기를 재지 못했습니다"); }
    if (fitCamera) fit(); else showSize();
  } catch (e) {
    next?.dispose?.();
    if (token !== loadToken) return;
    results.push({ name, size: bytes.byteLength, error: e.message });
    renderTable();
    fail("s-decode", `"${name}" 를 알갱이로 풀지 못했습니다: ${e.message}` +
      (mesh ? "\n앞서 보던 장면을 그대로 둡니다." : ""));
  }
}

function worldBox() {
  mesh.updateMatrixWorld(true);
  return localBox.clone().applyMatrix4(mesh.matrixWorld);
}
function showSize() {
  const s = worldBox().getSize(new THREE.Vector3());
  step("s-measure", "ok", `크기 재기 (${s.x.toFixed(2)} × ${s.y.toFixed(2)} × ${s.z.toFixed(2)})`);
}
function fit() {
  if (!mesh || !localBox) return;
  const box = worldBox();
  const center = box.getCenter(new THREE.Vector3());
  const radius = box.getSize(new THREE.Vector3()).length() / 2;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.9;
  const dir = new THREE.Vector3(0.0, 0.25, 1).normalize();   // 정면에서 조금 위
  controls.target.copy(center);
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = Math.max(radius / 500, 0.001);
  camera.far = radius * 50;
  camera.updateProjectionMatrix();
  controls.minDistance = radius * 0.02;
  controls.maxDistance = radius * 10;
  controls.update();
  showSize();
}

// 3. 파일 받기
step("s-fetch", "run");
$("v-file").textContent = SPLAT_FILE;
try {
  const t0 = performance.now();
  const r = await fetch(SPLAT_FILE);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const bytes = new Uint8Array(await r.arrayBuffer());
  $("v-time").textContent = `${((performance.now() - t0) / 1000).toFixed(2)}초`;
  step("s-fetch", "ok");
  await showSplats(bytes, SPLAT_FILE, { fitCamera: true });
} catch (e) {
  fail("s-fetch", `"${SPLAT_FILE}" 를 못 받았습니다: ${e.message}\n` +
    "파일이 같은 폴더에 있는지, file:// 이 아니라 로컬 서버(http://)로 열었는지 확인하세요.\n" +
    "파일을 끌어다 놓아서 열 수도 있습니다.");
}

// 끌어다 놓기와 파일 열기: 같은 시점에서 견주도록 카메라는 그대로 둔다
async function openLocalFile(file) {
  $("v-time").textContent = "끌어다 놓음 (받기 없음)";
  step("s-fetch", "ok", "파일 받기 (내 컴퓨터에서)");
  const bytes = new Uint8Array(await file.arrayBuffer());
  await showSplats(bytes, file.name, { fitCamera: !mesh });
}
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("drop").classList.add("show"); });
addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $("drop").classList.remove("show"); } });
addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; $("drop").classList.remove("show");
  const file = e.dataTransfer?.files?.[0];
  if (file) openLocalFile(file);
});
$("b-open").onclick = () => $("picker").click();
$("picker").onchange = e => { const f = e.target.files?.[0]; if (f) openLocalFile(f); e.target.value = ""; };

// 위아래 뒤집기: x 축으로 180도 돌리면 y 와 z 의 부호가 함께 바뀐다
$("b-flip").onclick = e => {
  flipped = !flipped;
  if (mesh) mesh.rotation.x = flipped ? Math.PI : 0;
  e.currentTarget.classList.toggle("on", flipped);
  fit();
};
$("b-fit").onclick = fit;

window.viewer = { THREE, SPARK, scene, camera, controls, renderer, spark, get mesh() { return mesh; }, fit, results, openLocalFile };
</script>
</body>
</html>
